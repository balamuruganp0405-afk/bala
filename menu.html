  <style>
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
      margin: 0;
    }
    .menu-container {
      width: 100%;
      max-width: 480px;
      text-align: center;
      padding: 2.5rem 1.5rem;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
    }
    .profile-photo {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      object-fit: cover;
      margin-bottom: 1rem;
      box-shadow: var(--shadow-md);
    }
    .profile-name {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .profile-tag {
      color: var(--primary);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .menu-link-btn {
      display: block;
      padding: 1.1rem 1.5rem;
      border: 1px solid var(--border-color);
      background-color: rgba(255, 255, 255, 0.02);
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: var(--radius-md);
      transition: var(--transition-normal);
      text-align: center;
      letter-spacing: 0.5px;
    }
    .menu-link-btn:hover {
      background-color: var(--primary);
      color: #fff;
      border-color: var(--primary);
      transform: scale(1.02);
      box-shadow: var(--shadow-md);
    }
    .menu-link-btn.highlight {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .menu-link-btn.highlight:hover {
      background-color: transparent;
      color: var(--primary);
      border-color: var(--primary);
    }
    .social-row {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    .social-link-item {
      color: var(--text-muted);
      transition: var(--transition-normal);
    }
    .social-link-item:hover {
      color: var(--primary);
      transform: scale(1.15);
    }
    .social-link-item svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
  </style>
